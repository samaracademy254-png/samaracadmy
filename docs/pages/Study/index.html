<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سمر أكاديمي - شرح الدروس</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<script src="../../assets/js/utils/security.js" defer></script>
<script src="../../assets/js/services/api.service.js" defer></script>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --primary: #0A4D8C;
  --primary-dark: #062A4A;
  --primary-light: #D4E6F1;
  --gold: #C8A44D;
  --gray: #64748B;
  --white: #FFFFFF;
  --shadow: 0 4px 20px rgba(0,0,0,0.08);
}
body {
  font-family: 'Cairo', sans-serif;
  background: #F8FAFC;
  min-height: 100vh;
  padding: 20px;
}
.container {
  max-width: 1000px;
  margin: 0 auto;
  background: var(--white);
  border-radius: 24px;
  box-shadow: var(--shadow);
  padding: 30px;
}
.header {
  text-align: center;
  padding-bottom: 20px;
  border-bottom: 2px solid #E8F0E8;
  margin-bottom: 25px;
}
.header h1 { color: var(--primary); font-weight: 900; font-size: 1.8rem; }
.header .subtitle { color: var(--gray); font-size: 1rem; }

.grade-selector, .subject-selector {
  display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;
  margin-top: 12px;
}
.grade-btn, .subject-btn {
  background: #e2e8f0; border: none; color: #475569;
  padding: 6px 16px; border-radius: 30px; font-weight: bold;
  cursor: pointer; transition: .2s; font-size: 0.9rem;
  font-family: 'Cairo';
}
.grade-btn.active, .grade-btn:hover,
.subject-btn.active, .subject-btn:hover {
  background: var(--primary); color: white;
}

/* ===== Grid Cards ===== */
.grid-cards {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 15px; margin-top: 20px;
}
.card-item {
  background: white; border: 2px solid #e2e8f0; border-radius: 16px;
  padding: 20px 15px; cursor: pointer; transition: .2s;
  text-align: center; font-weight: 700;
}
.card-item:hover {
  border-color: var(--primary); background: #f0fdf4;
  transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.05);
}
.card-item .icon { font-size: 2.5rem; margin-bottom: 8px; }
.card-item .sub { font-size: 0.8rem; color: var(--gray); font-weight: 400; }
.card-item .badge-html {
  display: inline-block;
  background: #0e7c86; color: white;
  font-size: 0.6rem; padding: 2px 10px; border-radius: 30px;
  margin-top: 5px;
}
.card-item .badge-json {
  display: inline-block;
  background: #c9830a; color: white;
  font-size: 0.6rem; padding: 2px 10px; border-radius: 30px;
  margin-top: 5px;
}
.card-item .badge-review {
  display: inline-block;
  background: #9b1a2a; color: white;
  font-size: 0.6rem; padding: 2px 10px; border-radius: 30px;
  margin-top: 5px;
}

.back-btn {
  background: var(--gray); color: white; border: none;
  padding: 8px 24px; border-radius: 30px; cursor: pointer;
  font-weight: 700; font-family: 'Cairo'; margin-bottom: 15px;
  transition: .2s;
}
.back-btn:hover { background: #475569; }

.video-container {
  position: relative;
  padding-bottom: 56.25%;
  height: 0;
  overflow: hidden;
  border-radius: 16px;
  margin-bottom: 25px;
  background: #1a1a2e;
}
.video-container iframe {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%; border: none;
}
.summary-box {
  background: var(--primary-light);
  padding: 25px;
  border-radius: 16px;
  border-right: 5px solid var(--primary);
  text-align: right;
  line-height: 1.9;
  font-size: 1.05rem;
  color: #1a2e1a;
}
.summary-box h3 { color: var(--primary); margin-bottom: 10px; font-weight: 900; }

/* ===== Iframe Container ===== */
.iframe-lesson-wrapper {
  position: relative;
  width: 100%;
  height: 0;
  padding-bottom: 120%;
  overflow: hidden;
  border-radius: 16px;
  border: 1px solid #e2e8f0;
  background: #0d1b2a;
  margin: 15px 0;
}
.iframe-lesson-wrapper iframe {
  position: absolute;
  top: 0; right: 0;
  width: 100%;
  height: 100%;
  border: none;
  background: transparent;
}

.actions {
  display: flex; gap: 15px; margin-top: 25px;
  justify-content: center; flex-wrap: wrap;
}
.btn {
  padding: 12px 30px; border: none; border-radius: 30px;
  font-weight: 700; font-size: 1rem; cursor: pointer;
  transition: all 0.3s ease; text-decoration: none;
  display: inline-block; font-family: 'Cairo';
}
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(10,77,140,0.3); }
.btn-outline { background: transparent; color: var(--primary); border: 2px solid var(--primary); }
.btn-outline:hover { background: var(--primary); color: white; }
.btn-success { background: #059669; color: white; }
.btn-success:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(5,150,105,0.3); }

.loading { text-align: center; padding: 50px; color: var(--gray); }
.spinner {
  border: 4px solid #f3f3f3;
  border-top: 4px solid var(--primary);
  border-radius: 50%;
  width: 40px;
  height: 40px;
  animation: spin 1s linear infinite;
  margin: 0 auto 15px;
}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

@media (max-width: 640px) {
  .container { padding: 15px; }
  .header h1 { font-size: 1.4rem; }
  .summary-box { font-size: 0.95rem; padding: 18px; }
  .grid-cards { grid-template-columns: 1fr 1fr; }
  .iframe-lesson-wrapper { padding-bottom: 150%; }
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>📖 محرك الشرح التعليمي</h1>
    <div class="subtitle" id="lessonInfo">اختر الصف والمادة</div>
    <div class="grade-selector" id="gradeSelector">
      <button data-grade="p4" class="grade-btn active">رابع</button>
      <button data-grade="p5" class="grade-btn">خامس</button>
      <button data-grade="p6" class="grade-btn">سادس</button>
      <button data-grade="m1" class="grade-btn">أول متوسط</button>
      <button data-grade="m2" class="grade-btn">ثاني متوسط</button>
      <button data-grade="m3" class="grade-btn">ثالث متوسط</button>
    </div>
    <div class="subject-selector" id="subjectSelector">
      <button data-subject="arabic" class="subject-btn active">📖 لغة عربية</button>
      <button data-subject="social" class="subject-btn">🌍 دراسات</button>
      <button data-subject="science" class="subject-btn">🔬 علوم</button>
      <button data-subject="math" class="subject-btn">📐 رياضيات</button>
    </div>
  </div>

  <div id="contentArea">
    <div class="loading">
      <div class="spinner"></div>
      <p>⏳ جاري تحميل الوحدات...</p>
    </div>
  </div>

  <div class="actions">
    <a href="../../index.html" class="btn btn-outline">🏠 الرئيسية</a>
    <a href="../Home/index.html" id="quizLink" class="btn btn-success">📝 الذهاب للاختبار</a>
  </div>
</div>

<script>
// ============================================================
// محرك الشرح - النسخة المطورة (V5.0) تدعم الهيكل الجديد
// ============================================================
let currentGrade = 'p4';
let currentSubject = 'arabic';
let currentUnitId = null;
let currentLessonId = null;

const contentArea = document.getElementById('contentArea');
const gradeBtns = document.querySelectorAll('.grade-btn');
const subjectBtns = document.querySelectorAll('.subject-btn');
const quizLink = document.getElementById('quizLink');

// ===== تحميل الوحدات =====
async function loadUnits() {
    contentArea.innerHTML = '<div class="loading"><div class="spinner"></div><p>⏳ جاري تحميل الوحدات...</p></div>';
    try {
        const res = await fetch('../../data/units.json');
        if (!res.ok) throw new Error('units.json غير موجود');
        const data = await res.json();
        const units = data[currentGrade]?.[currentSubject]?.units || [];
        if (!units.length) {
            contentArea.innerHTML = '<div style="color:#dc2626;padding:20px;text-align:center;">⚠️ لا توجد وحدات</div>';
            return;
        }
        let html = `<div style="margin-bottom:15px;"><h3 style="color:var(--primary);">📚 اختر الوحدة</h3><p style="color:var(--gray);font-size:0.9rem;">${currentGrade} - ${currentSubject}</p></div><div class="grid-cards">`;
        units.forEach(unit => {
            html += `<div class="card-item" onclick="loadLessons('${unit.id}')"><div class="icon">📖</div><div>${unit.name}</div><div class="sub">${unit.lessons} دروس</div></div>`;
        });
        html += `</div>`;
        contentArea.innerHTML = html;
    } catch (e) {
        contentArea.innerHTML = `<div style="color:#dc2626;padding:20px;text-align:center;">⚠️ ${e.message}</div>`;
    }
}

// ===== تحميل قائمة الدروس =====
window.loadLessons = async function(unitId) {
    currentUnitId = unitId;
    contentArea.innerHTML = '<div class="loading"><div class="spinner"></div><p>⏳ جاري تحميل الدروس...</p></div>';
    try {
        const path = `../../data/study_data/${currentGrade}/${currentSubject}/${unitId}/lessons.json`;
        const res = await fetch(path);
        if (!res.ok) throw new Error('lessons.json غير موجود');
        const data = await res.json();
        const lessons = data.lessons || [];

        if (!lessons.length) {
            contentArea.innerHTML = `<button class="back-btn" onclick="loadUnits()">⬅️ العودة</button><div style="color:#dc2626;padding:20px;text-align:center;">⚠️ لا توجد دروس في هذه الوحدة</div>`;
            return;
        }

        let html = `<button class="back-btn" onclick="loadUnits()">⬅️ العودة للوحدات</button><h3 style="color:var(--primary);">📖 دروس الوحدة</h3><div class="grid-cards">`;
        lessons.forEach((lesson) => {
            const isHtml = lesson.page ? true : false;
            const isReview = lesson.type === 'review';
            
            let badge = '';
            let icon = '📄';
            let subText = 'مراجعة سريعة';
            if (isHtml) {
                badge = '<span class="badge-html">📄 تفاعلي</span>';
                icon = '🎨';
                subText = 'محتوى غني بالصور والجداول';
            } else if (isReview) {
                badge = '<span class="badge-review">📝 مراجعة</span>';
                icon = '📝';
                subText = 'ملخص ومراجعة';
            } else {
                badge = '<span class="badge-json">📝 نصي</span>';
                icon = '📄';
                subText = 'شرح نصي وفيديو';
            }

            html += `<div class="card-item" onclick="loadLessonContent('${unitId}', '${lesson.id}')">
                <div class="icon">${icon}</div>
                <div>${lesson.name}</div>
                <div class="sub">${subText}</div>
                ${badge}
            </div>`;
        });
        html += `</div>`;
        contentArea.innerHTML = html;
    } catch (e) {
        contentArea.innerHTML = `<button class="back-btn" onclick="loadUnits()">⬅️ العودة</button><div style="color:#dc2626;padding:20px;text-align:center;">⚠️ فشل تحميل الدروس: ${e.message}</div>`;
    }
};

// ===== تحميل محتوى الدرس =====
window.loadLessonContent = async function(unitId, lessonId) {
    currentUnitId = unitId;
    currentLessonId = lessonId;
    contentArea.innerHTML = '<div class="loading"><div class="spinner"></div><p>⏳ جاري تحميل الدرس...</p></div>';

    try {
        // 1. جلب محتوى الدرس من ملف JSON
        const path = `../../data/study_data/${currentGrade}/${currentSubject}/${unitId}/${lessonId}.json`;
        const res = await fetch(path);
        if (!res.ok) throw new Error('الدرس غير موجود');
        const data = await res.json();

        // 2. عرض المحتوى
        let html = `
            <button class="back-btn" onclick="loadLessons('${unitId}')">⬅️ العودة للدروس</button>
            <h2 style="color:var(--primary);margin-bottom:20px;">📌 ${data.title || 'شرح الدرس'}</h2>
        `;

        // 2.a إذا كان هناك صفحة HTML مخصصة (درس تفاعلي)
        if (data.page) {
            // إضافة اسم المستودع للمسار إذا كان مطلقاً
            let pagePath = data.page;
            if (pagePath.startsWith('/')) {
                pagePath = '/samaracadmy' + pagePath;
            }

            html = `
                <button class="back-btn" onclick="loadLessons('${unitId}')">⬅️ العودة للدروس</button>
                <h2 style="color:var(--primary);margin-bottom:10px;">📌 ${data.title || 'درس تفاعلي'}</h2>
                <div class="iframe-lesson-wrapper">
                    <iframe 
                        src="${pagePath}" 
                        loading="lazy"
                        allowfullscreen
                        sandbox="allow-scripts allow-same-origin allow-forms allow-popups"
                    ></iframe>
                </div>
                <p style="color:var(--gray);font-size:0.8rem;text-align:center;">📌 محتوى تفاعلي غني بالرسوم التوضيحية والجداول</p>
            `;
            contentArea.innerHTML = html;
            return;
        }

        // 2.b العرض النصي التقليدي (JSON) - في حالة عدم وجود page
        if (data.videoUrl && data.videoUrl !== '') {
            html += `<div class="video-container"><iframe src="${data.videoUrl}" allowfullscreen loading="lazy"></iframe></div>`;
        }

        const summaryContent = data.summary || 'لم يتم إضافة محتوى بعد.';
        html += `<div class="summary-box"><h3>📋 المحتوى التعليمي</h3><div>${summaryContent}</div></div>`;
        
        contentArea.innerHTML = html;

    } catch (e) {
        console.error('Error loading lesson:', e);
        contentArea.innerHTML = `
            <button class="back-btn" onclick="loadLessons('${unitId}')">⬅️ العودة للدروس</button>
            <div style="color:#dc2626;padding:20px;text-align:center;">
                ⚠️ فشل تحميل الدرس: ${e.message}
            </div>
        `;
    }
};

// ===== دوال تبديل الصف والمادة =====
function setActiveGrade(g) { gradeBtns.forEach(b => b.classList.toggle('active', b.dataset.grade === g)); }
function setActiveSubject(s) { subjectBtns.forEach(b => b.classList.toggle('active', b.dataset.subject === s)); }

gradeBtns.forEach(btn => btn.addEventListener('click', () => {
    currentGrade = btn.dataset.grade;
    setActiveGrade(currentGrade);
    quizLink.href = `../Home/index.html?grade=${currentGrade}&subject=${currentSubject}`;
    loadUnits();
}));

subjectBtns.forEach(btn => btn.addEventListener('click', () => {
    currentSubject = btn.dataset.subject;
    setActiveSubject(currentSubject);
    quizLink.href = `../Home/index.html?grade=${currentGrade}&subject=${currentSubject}`;
    loadUnits();
}));

// ===== بدء التشغيل =====
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('grade')) currentGrade = urlParams.get('grade');
if (urlParams.get('subject')) currentSubject = urlParams.get('subject');
setActiveGrade(currentGrade);
setActiveSubject(currentSubject);
quizLink.href = `../Home/index.html?grade=${currentGrade}&subject=${currentSubject}`;
document.getElementById('lessonInfo').textContent = `${currentGrade} - ${currentSubject}`;
loadUnits();
</script>
</body>
</html>
