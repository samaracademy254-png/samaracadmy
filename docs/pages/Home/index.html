<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>سمر أكاديمي - الاختبارات</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
<script src="../../assets/js/utils/security.js" defer></script>
<script src="../../assets/js/services/api.service.js" defer></script>
<style>
/* ===== أنماط الاختبارات ===== */
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --primary: #0A4D8C;
  --primary-dark: #062A4A;
  --gold: #C8A44D;
  --gray: #64748B;
  --white: #FFFFFF;
  --shadow: 0 4px 20px rgba(0,0,0,0.08);
  --radius: 16px;
}
body {
  font-family: 'Cairo', sans-serif;
  background: #F8FAFC;
  min-height: 100vh;
  padding: 20px;
}
.container {
  max-width: 1000px;
  margin: 0 auto;
  background: var(--white);
  border-radius: 24px;
  box-shadow: var(--shadow);
  padding: 30px;
}
.header {
  text-align: center;
  padding-bottom: 20px;
  border-bottom: 2px solid #E8F0E8;
  margin-bottom: 25px;
}
.header h1 { color: var(--primary); font-weight: 900; font-size: 1.8rem; }
.header .subtitle { color: var(--gray); font-size: 1rem; }

.grade-selector, .subject-selector {
  display: flex; justify-content: center; gap: 10px; flex-wrap: wrap;
  margin-top: 12px;
}
.grade-btn, .subject-btn {
  background: #e2e8f0; border: none; color: #475569;
  padding: 6px 16px; border-radius: 30px; font-weight: bold;
  cursor: pointer; transition: .2s; font-size: 0.9rem;
  font-family: 'Cairo';
}
.grade-btn.active, .grade-btn:hover,
.subject-btn.active, .subject-btn:hover {
  background: var(--primary); color: white;
}

.grid-cards {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 15px; margin-top: 20px;
}
.card-item {
  background: white; border: 2px solid #e2e8f0; border-radius: 16px;
  padding: 20px 15px; cursor: pointer; transition: .2s;
  text-align: center; font-weight: 700;
}
.card-item:hover {
  border-color: var(--primary); background: #f0fdf4;
  transform: translateY(-3px); box-shadow: 0 8px 25px rgba(0,0,0,0.05);
}
.card-item .icon { font-size: 2.5rem; margin-bottom: 8px; }
.card-item .sub { font-size: 0.8rem; color: var(--gray); font-weight: 400; }
.card-item .badge-quiz {
  display: inline-block;
  background: #9b1a2a; color: white;
  font-size: 0.6rem; padding: 2px 10px; border-radius: 30px;
  margin-top: 5px;
}
.card-item .badge-final {
  display: inline-block;
  background: #c9830a; color: white;
  font-size: 0.6rem; padding: 2px 10px; border-radius: 30px;
  margin-top: 5px;
}
.back-btn {
  background: var(--gray); color: white; border: none;
  padding: 8px 24px; border-radius: 30px; cursor: pointer;
  font-weight: 700; font-family: 'Cairo'; margin-bottom: 15px;
  transition: .2s;
}
.back-btn:hover { background: #475569; }

.loading { text-align: center; padding: 50px; color: var(--gray); }
.spinner {
  border: 4px solid #f3f3f3;
  border-top: 4px solid var(--primary);
  border-radius: 50%;
  width: 40px;
  height: 40px;
  animation: spin 1s linear infinite;
  margin: 0 auto 15px;
}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

.quiz-container { padding: 15px 0; }
.question-box {
  background: #f8fafc;
  border-radius: 16px;
  padding: 20px;
  margin-bottom: 15px;
  border: 1px solid #e2e8f0;
}
.question-box .q-text { font-size: 1.1rem; font-weight: 700; margin-bottom: 12px; }
.options-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.opt-btn {
  background: white; border: 2px solid #e2e8f0;
  border-radius: 12px; padding: 10px 15px;
  cursor: pointer; font-family: 'Cairo'; font-weight: 600;
  transition: .2s; text-align: right;
}
.opt-btn:hover:not(.locked) { border-color: var(--primary); background: var(--primary-light); }
.opt-btn.correct { background: #d1fae5; border-color: #059669; }
.opt-btn.wrong { background: #fee2e2; border-color: #dc2626; }
.opt-btn.locked { pointer-events: none; }
.feedback { margin-top: 10px; padding: 10px; border-radius: 8px; display: none; }
.feedback.success { display: block; background: #d1fae5; color: #065f46; }
.feedback.error { display: block; background: #fee2e2; color: #991b1b; }

.quiz-controls {
  display: flex; gap: 10px; justify-content: center;
  margin-top: 20px; flex-wrap: wrap;
}
.btn {
  padding: 10px 25px; border: none; border-radius: 30px;
  font-weight: 700; cursor: pointer; font-family: 'Cairo';
  transition: .2s;
}
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { background: var(--primary-dark); }
.btn-outline { background: transparent; color: var(--primary); border: 2px solid var(--primary); }
.btn-outline:hover { background: var(--primary); color: white; }
.btn-success { background: #059669; color: white; }

@media (max-width: 640px) {
  .container { padding: 15px; }
  .options-grid { grid-template-columns: 1fr; }
  .grid-cards { grid-template-columns: 1fr 1fr; }
}
</style>
</head>
<body>

<div class="container">
  <div class="header">
    <h1>📝 محرك الاختبارات</h1>
    <div class="subtitle" id="testInfo">اختر الصف والمادة</div>
    <div class="grade-selector" id="gradeSelector">
      <button data-grade="p4" class="grade-btn active">رابع</button>
      <button data-grade="p5" class="grade-btn">خامس</button>
      <button data-grade="p6" class="grade-btn">سادس</button>
      <button data-grade="m1" class="grade-btn">أول متوسط</button>
      <button data-grade="m2" class="grade-btn">ثاني متوسط</button>
      <button data-grade="m3" class="grade-btn">ثالث متوسط</button>
    </div>
    <div class="subject-selector" id="subjectSelector">
      <button data-subject="arabic" class="subject-btn active">📖 لغة عربية</button>
      <button data-subject="social" class="subject-btn">🌍 دراسات</button>
      <button data-subject="science" class="subject-btn">🔬 علوم</button>
      <button data-subject="math" class="subject-btn">📐 رياضيات</button>
    </div>
  </div>

  <div id="contentArea">
    <div class="loading">
      <div class="spinner"></div>
      <p>⏳ جاري تحميل الاختبارات...</p>
    </div>
  </div>

  <div class="quiz-controls">
    <a href="../../index.html" class="btn btn-outline">🏠 الرئيسية</a>
    <a href="../Study/index.html" id="studyLink" class="btn btn-success">📖 العودة للشرح</a>
  </div>
</div>

<script>
// ============================================================
// محرك الاختبارات - النسخة المطورة (V5.0)
// ============================================================
let currentGrade = 'p4';
let currentSubject = 'arabic';
let currentUnitId = null;
let currentLessonId = null;
let questions = [];
let currentIndex = 0;
let score = 0;
let correctCount = 0;
let wrongCount = 0;
let answered = false;

const contentArea = document.getElementById('contentArea');
const gradeBtns = document.querySelectorAll('.grade-btn');
const subjectBtns = document.querySelectorAll('.subject-btn');
const studyLink = document.getElementById('studyLink');

// ===== تحميل الوحدات =====
async function loadUnits() {
    contentArea.innerHTML = '<div class="loading"><div class="spinner"></div><p>⏳ جاري تحميل الوحدات...</p></div>';
    try {
        const res = await fetch('../../data/units.json');
        if (!res.ok) throw new Error('units.json غير موجود');
        const data = await res.json();
        const units = data[currentGrade]?.[currentSubject]?.units || [];
        if (!units.length) {
            contentArea.innerHTML = '<div style="color:#dc2626;padding:20px;text-align:center;">⚠️ لا توجد وحدات</div>';
            return;
        }
        let html = `<div style="margin-bottom:15px;"><h3 style="color:var(--primary);">📚 اختر الوحدة</h3><p style="color:var(--gray);font-size:0.9rem;">${currentGrade} - ${currentSubject}</p></div><div class="grid-cards">`;
        units.forEach(unit => {
            html += `<div class="card-item" onclick="loadLessons('${unit.id}')"><div class="icon">📖</div><div>${unit.name}</div><div class="sub">اختبارات</div></div>`;
        });
        html += `</div>`;
        contentArea.innerHTML = html;
    } catch (e) {
        contentArea.innerHTML = `<div style="color:#dc2626;padding:20px;text-align:center;">⚠️ ${e.message}</div>`;
    }
}

// ===== تحميل قائمة الاختبارات =====
window.loadLessons = async function(unitId) {
    currentUnitId = unitId;
    contentArea.innerHTML = '<div class="loading"><div class="spinner"></div><p>⏳ جاري تحميل الاختبارات...</p></div>';
    try {
        const path = `../../data/quiz_data/${currentGrade}/${currentSubject}/${unitId}/lessons.json`;
        const res = await fetch(path);
        if (!res.ok) throw new Error('لا توجد اختبارات');
        const data = await res.json();
        const lessons = data.lessons || [];

        if (!lessons.length) {
            contentArea.innerHTML = `<button class="back-btn" onclick="loadUnits()">⬅️ العودة</button><div style="color:#dc2626;padding:20px;text-align:center;">⚠️ لا توجد اختبارات في هذه الوحدة</div>`;
            return;
        }

        let html = `<button class="back-btn" onclick="loadUnits()">⬅️ العودة للوحدات</button><h3 style="color:var(--primary);">📝 اختبارات الوحدة</h3><div class="grid-cards">`;
        lessons.forEach((lesson) => {
            const isFinal = lesson.type === 'final';
            const badge = isFinal ? '<span class="badge-final">🏆 شامل</span>' : '<span class="badge-quiz">📝 اختبار</span>';
            const icon = isFinal ? '🏆' : '📝';
            const subText = isFinal ? 'اختبار نهائي شامل' : 'أسئلة على الدرس';
            html += `<div class="card-item" onclick="startQuiz('${unitId}', '${lesson.id}')">
                <div class="icon">${icon}</div>
                <div>${lesson.name}</div>
                <div class="sub">${subText}</div>
                ${badge}
            </div>`;
        });
        html += `</div>`;
        contentArea.innerHTML = html;
    } catch (e) {
        contentArea.innerHTML = `<button class="back-btn" onclick="loadUnits()">⬅️ العودة</button><div style="color:#dc2626;padding:20px;text-align:center;">⚠️ فشل تحميل الاختبارات: ${e.message}</div>`;
    }
};

// ===== بدء الاختبار =====
window.startQuiz = async function(unitId, lessonId) {
    currentUnitId = unitId;
    currentLessonId = lessonId;
    contentArea.innerHTML = '<div class="loading"><div class="spinner"></div><p>⏳ جاري تحميل الأسئلة...</p></div>';

    try {
        const path = `../../data/quiz_data/${currentGrade}/${currentSubject}/${unitId}/${lessonId}.json`;
        const res = await fetch(path);
        if (!res.ok) throw new Error('الاختبار غير موجود');
        const data = await res.json();

        questions = data.questions || [];
        if (!questions.length) throw new Error('لا توجد أسئلة');
        if (data.shuffle) {
            for (let i = questions.length - 1; i > 0; i--) {
                let j = Math.floor(Math.random() * (i + 1));
                [questions[i], questions[j]] = [questions[j], questions[i]];
            }
        }

        currentIndex = 0;
        score = 0;
        correctCount = 0;
        wrongCount = 0;
        renderQuestion();

    } catch (e) {
        contentArea.innerHTML = `<button class="back-btn" onclick="loadLessons('${unitId}')">⬅️ العودة</button><div style="color:#dc2626;padding:20px;text-align:center;">⚠️ فشل تحميل الأسئلة: ${e.message}</div>`;
    }
};

// ===== عرض السؤال =====
function renderQuestion() {
    if (currentIndex >= questions.length) {
        showResult();
        return;
    }

    const q = questions[currentIndex];
    answered = false;
    const labels = ['أ', 'ب', 'ج', 'د'];

    let html = `
        <div class="quiz-container">
            <div style="display:flex;justify-content:space-between;margin-bottom:15px;">
                <span style="font-weight:700;color:var(--primary);">السؤال ${currentIndex + 1} من ${questions.length}</span>
                <span style="color:var(--gray);">⭐ ${score} نقطة</span>
            </div>
            <div class="question-box">
                <div class="q-text">${q.question}</div>
                <div class="options-grid">
    `;

    q.options.forEach((opt, idx) => {
        html += `<button class="opt-btn" data-opt="${idx}" onclick="checkAnswer(${idx}, this)">${labels[idx]}. ${opt}</button>`;
    });

    html += `
                </div>
                <div class="feedback" id="feedbackMsg"></div>
            </div>
        </div>
    `;

    contentArea.innerHTML = html;
}

// ===== التحقق من الإجابة =====
window.checkAnswer = function(selectedIdx, element) {
    if (answered) return;
    answered = true;

    const q = questions[currentIndex];
    const isCorrect = (selectedIdx === q.correct);
    const allOpts = document.querySelectorAll('.opt-btn');

    allOpts.forEach((btn, idx) => {
        btn.classList.add('locked');
        if (idx === q.correct) btn.classList.add('correct');
        if (idx === selectedIdx && !isCorrect) btn.classList.add('wrong');
    });

    const fb = document.getElementById('feedbackMsg');
    if (isCorrect) {
        score += (q.points || 10);
        correctCount++;
        fb.className = 'feedback success';
        fb.textContent = '✅ ' + (q.explanation || 'إجابة صحيحة!');
    } else {
        wrongCount++;
        fb.className = 'feedback error';
        fb.textContent = '❌ ' + (q.explanation || 'الإجابة الصحيحة: ' + q.options[q.correct]);
    }
    fb.style.display = 'block';

    setTimeout(() => {
        currentIndex++;
        renderQuestion();
    }, 2500);
};

// ===== عرض النتيجة =====
function showResult() {
    const percent = Math.round((correctCount / questions.length) * 100);
    let msg = '';
    if (percent >= 90) msg = '🏆 ممتاز! بطل العلم';
    else if (percent >= 70) msg = '⭐ جيد جداً، استمر';
    else if (percent >= 50) msg = '📖 جيد، راجع الأخطاء';
    else msg = '💪 لا تيأس، المحاولة القادمة أفضل';

    contentArea.innerHTML = `
        <div style="text-align:center;padding:30px;">
            <div style="font-size:4rem;">🎓</div>
            <div style="font-size:2.5rem;font-weight:900;color:var(--primary);">${percent}%</div>
            <div style="font-size:1.2rem;margin:15px;">${msg}</div>
            <div style="display:flex;justify-content:center;gap:20px;flex-wrap:wrap;margin:15px 0;">
                <div>✅ صحيح: ${correctCount}</div>
                <div>❌ خطأ: ${wrongCount}</div>
                <div>⭐ نقاط: ${score}</div>
            </div>
            <button class="btn btn-primary" onclick="loadLessons('${currentUnitId}')">⬅️ العودة للاختبارات</button>
        </div>
    `;
}

// ===== دوال تبديل الصف والمادة =====
function setActiveGrade(g) { gradeBtns.forEach(b => b.classList.toggle('active', b.dataset.grade === g)); }
function setActiveSubject(s) { subjectBtns.forEach(b => b.classList.toggle('active', b.dataset.subject === s)); }

gradeBtns.forEach(btn => btn.addEventListener('click', () => {
    currentGrade = btn.dataset.grade;
    setActiveGrade(currentGrade);
    studyLink.href = `../Study/index.html?grade=${currentGrade}&subject=${currentSubject}`;
    loadUnits();
}));

subjectBtns.forEach(btn => btn.addEventListener('click', () => {
    currentSubject = btn.dataset.subject;
    setActiveSubject(currentSubject);
    studyLink.href = `../Study/index.html?grade=${currentGrade}&subject=${currentSubject}`;
    loadUnits();
}));

// ===== بدء التشغيل =====
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('grade')) currentGrade = urlParams.get('grade');
if (urlParams.get('subject')) currentSubject = urlParams.get('subject');
setActiveGrade(currentGrade);
setActiveSubject(currentSubject);
studyLink.href = `../Study/index.html?grade=${currentGrade}&subject=${currentSubject}`;
document.getElementById('testInfo').textContent = `${currentGrade} - ${currentSubject}`;
loadUnits();
</script>
</body>
</html>
